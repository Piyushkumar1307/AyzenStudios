# Static frontend on Netlify; FastAPI API on Render.
# Repo root for Netlify: HandGesture-WebNavigation (or set base directory in Netlify UI).

[build]
  publish = "static"
  command = "node scripts/netlify-build.js"

[build.environment]
  NODE_VERSION = "20"
  SPOOKY_API_BASE = "https://ayzenstudios.onrender.com"

# HTML uses /static/... paths; publish root is static/, so map to files at /
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

