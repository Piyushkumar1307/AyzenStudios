<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/static/favicon-set.js"></script>
<script src="/js/runtime-config.js?v=5"></script>
<script src="/js/spooky-api.js?v=5"></script>
<script src="/js/webgl-games.js?v=8"></script>
<title>Playing — Ayzen Studios</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#f3eef8;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#160d22;border-bottom:1px solid rgba(167,139,250,.2);flex-shrink:0}
  .bar a,.bar button{color:#a78bfa;text-decoration:none;font-weight:600;font-size:14px;background:none;border:none;cursor:pointer;font-family:inherit}
  .room-pill{font-size:12px;color:#9d8fb0}
  .room-pill strong{color:#a78bfa;letter-spacing:.15em}
  #frameWrap{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #frameWrap.portrait #gameShell{
    height:100%;
    width:auto;
    max-width:100%;
    aspect-ratio:9/16;
    position:relative;
    box-shadow:0 0 0 1px rgba(167,139,250,.15);
  }
  #frameWrap.landscape #gameShell{
    width:100%;
    height:auto;
    max-height:100%;
    aspect-ratio:16/9;
    position:relative;
    box-shadow:0 0 0 1px rgba(167,139,250,.15);
  }
  #gameShell{position:absolute;inset:0;width:100%;height:100%}
  #frameWrap.portrait #gameShell,
  #frameWrap.landscape #gameShell{position:relative;inset:auto}
  #gameFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
  .loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0c0612}
  .loading.hidden{display:none}
  .hint{font-size:13px;color:#9d8fb0;max-width:40ch;text-align:center;padding:0 20px}
</style>
</head>
<body>
<header class="bar">
  <a href="/webgl" id="backLink">← WebGL games</a>
  <span class="room-pill">Controller <strong id="roomDisplay">Phone</strong></span>
  <button type="button" id="btnPhone">Phone link</button>
</header>
<div id="frameWrap">
  <div class="loading" id="loading">
    <p>Loading game…</p>
    <p class="hint" id="loadHint">Keep your phone controller tab open.</p>
  </div>
  <div id="gameShell">
    <iframe id="gameFrame" title="WebGL game" allow="fullscreen; autoplay" allowfullscreen></iframe>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var slug = params.get("game") || "";
  var room = (params.get("room") || "").toUpperCase();
  var games = window.WEBGL_GAMES || [];
  var game = games.find(function (g) { return g.slug === slug; });

  document.getElementById("roomDisplay").textContent = "Phone";

  if (!game) {
    document.getElementById("loading").innerHTML = "<p>Unknown game. <a href='/webgl' style='color:#a78bfa'>Back to catalog</a></p>";
    return;
  }

  if (game.comingSoon) {
    var home = game.homeHref || "/webgl";
    document.getElementById("loading").innerHTML =
      "<p><strong>" + game.title + "</strong> is not live yet.</p>" +
      "<p class='hint'><a href='" + home + "' style='color:#a78bfa'>Back</a></p>";
    document.getElementById("gameShell").style.display = "none";
    return;
  }

  var isStandalone = game.appType === "standalone" || !game.phoneControllerUrl;
  if (isStandalone) {
    document.querySelector(".room-pill").style.display = "none";
    document.getElementById("btnPhone").style.display = "none";
    document.getElementById("loadHint").textContent = "Loading app…";
  }

  document.title = game.title + " — Ayzen Studios";

  if (game.homeHref) {
    document.getElementById("backLink").href = game.homeHref;
    document.getElementById("backLink").textContent = "← " + game.title;
  }

  if (game.orientation === "landscape") {
    var wrap = document.getElementById("frameWrap");
    wrap.classList.add("landscape");
    document.getElementById("gameShell").style.aspectRatio = game.aspectRatio || "16 / 9";
  } else if (game.orientation === "portrait" || game.aspectRatio) {
    var wrap = document.getElementById("frameWrap");
    wrap.classList.add("portrait");
    if (game.aspectRatio) {
      document.getElementById("gameShell").style.aspectRatio = game.aspectRatio;
    }
  }

  var buildUrl = game.buildPath;
  if (room) {
    if (buildUrl.indexOf("?") === -1) buildUrl += "?";
    else buildUrl += "&";
    buildUrl += "room=" + encodeURIComponent(room);
  }

  var frame = document.getElementById("gameFrame");
  var loading = document.getElementById("loading");

  frame.addEventListener("load", function () {
    loading.classList.add("hidden");
  });
  frame.src = buildUrl;

  document.getElementById("btnPhone").addEventListener("click", function () {
    var url = typeof phoneControllerUrl === "function"
      ? phoneControllerUrl(game.phoneControllerUrl)
      : (game.phoneControllerUrl || "https://phonecontrollerserver.onrender.com");
    navigator.clipboard.writeText(url).catch(function () {
      prompt("Open on your phone:", url);
    });
  });
})();
</script>
</body>
</html>
