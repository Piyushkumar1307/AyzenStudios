<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="/static/favicon-set.js"></script>
<script src="/js/runtime-config.js?v=5"></script>
<script src="/js/spooky-api.js?v=5"></script>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/gesture-instructions.css?v=3">
<title>How to play — Ayzen Studios</title>
<link rel="stylesheet" href="/css/ayzen-theme.css?v=2">
</head>
<body class="gi-page">
<div class="gi-page__bg" aria-hidden="true"></div>

<header class="gi-page__top">
  <a class="gi-page__back" href="/games">← Gesture games</a>
  <span class="gi-page__logo">Ayzen Studios</span>
</header>

<main class="gi-page__main">
  <div class="gi-game-card" id="gameCard">
    <div class="gi-game-card__hero" id="gameHero">
      <div class="gi-game-card__hero-shade"></div>
      <span class="gi-game-card__pill">Gesture game</span>
    </div>
    <div class="gi-shell gi-shell--page" id="instructionShell" role="main"></div>
  </div>
  <p class="gi-page__missing hidden" id="missingMsg">Game not found. <a href="/games">Back to catalog</a></p>
</main>

<script src="/js/gesture-games.js?v=3"></script>
<script src="/js/gesture-instructions.js?v=5"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("game") || "";
  var card = document.getElementById("gameCard");
  var missing = document.getElementById("missingMsg");
  if (!id || !window.GestureInstructions || !GestureInstructions.mountInstructionPage(id)) {
    if (card) card.classList.add("hidden");
    if (missing) missing.classList.remove("hidden");
  }
})();
</script>
<script src="/js/ayzen-motion.js?v=1" defer></script>
</body>
</html>
