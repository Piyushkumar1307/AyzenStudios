<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Rush — Piyush-Store</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    color: #e8e8f0;
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  #gameCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
  #handCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
  .hud {
    position: fixed;
    left: 0; right: 0; top: 0;
    padding: max(12px, env(safe-area-inset-top, 0px)) 18px 10px;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 10001; text-shadow: 0 2px 10px rgba(0,0,0,0.85); pointer-events: none;
  }
  .hud-block h2 { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #6b7280; }
  .hud-block .val { font-size: 26px; font-weight: 800; color: #22d3ee; }
  .hud a { pointer-events: auto; font-size: 13px; color: #a5b4fc; text-decoration: none; align-self: center; }
  .overlay {
    position: fixed; inset: 0; z-index: 10002;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5, 5, 16, 0.88); backdrop-filter: blur(8px); padding: 20px;
  }
  .overlay.hidden { display: none; }
  .panel {
    text-align: center; max-width: 460px; padding: 34px 28px;
    background: linear-gradient(145deg, #12121c, #0c0c14);
    border: 1px solid #2a2a3e; border-radius: 20px;
  }
  .panel h1 { font-size: 20px; letter-spacing: 4px; text-transform: uppercase; color: #fbbf24; margin-bottom: 12px; }
  .panel p { font-size: 14px; color: #9ca3af; line-height: 1.6; margin-bottom: 10px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  .btn {
    padding: 12px 26px; font-size: 14px; font-weight: 800; border-radius: 12px;
    cursor: pointer; border: none; text-transform: uppercase;
  }
  .btn-primary { color: #0f172a; background: #fbbf24; }
  .btn-ghost { color: #a5b4fc; background: transparent; border: 2px solid #6366f1; text-decoration: none; display: flex; align-items: center; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<canvas id="handCanvas"></canvas>

<div class="hud">
  <div class="hud-block">
    <h2>Distance</h2>
    <div class="val" id="distVal">0</div>
  </div>
  <div class="hud-block" style="text-align:right">
    <h2>Speed</h2>
    <div class="val" id="speedVal" style="color:#fbbf24;">1.0×</div>
  </div>
  <a href="/">← Store</a>
</div>

<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1>Traffic Rush</h1>
    <p>Dodge cars. The longer you survive, the faster traffic gets.</p>
    <p><strong>Steer</strong>: Pinch left hand to move left, pinch right hand to move right.</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnStart">Start</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <div class="panel">
    <h1>Crash</h1>
    <p>Distance: <strong id="finalDist">0</strong></p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnAgain">Retry</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const handCanvas = document.getElementById("handCanvas");
const hctx = handCanvas.getContext("2d");

const distVal = document.getElementById("distVal");
const speedVal = document.getElementById("speedVal");
const startOverlay = document.getElementById("startOverlay");
const gameOverOverlay = document.getElementById("gameOverOverlay");
const finalDistEl = document.getElementById("finalDist");
const btnStart = document.getElementById("btnStart");
const btnAgain = document.getElementById("btnAgain");

let W, H, DPR, laneX, laneW, playerY;
let running = false;
let playerLane = 1;
let enemies = [];
let lastSpawnAt = 0;
let spawnEveryMs = 1200; // Increased starting gap
let baseSpeed = 250;     // Balanced base speed
let speedMul = 1.0;
let speedRampAt = 0;
let distance = 0;
let lastFrameT = 0;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  handCanvas.width = W * DPR;
  handCanvas.height = H * DPR;
  handCanvas.style.width = W + "px";
  handCanvas.style.height = H + "px";
  hctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const roadW = Math.min(420, W * 0.85);
  laneW = (roadW - 24) / 3;
  const left = (W - roadW) / 2;
  laneX = [left + 18, left + 18 + laneW, left + 18 + laneW * 2];
  
  // Adjusted Car Dimensions
  const carW = laneW * 0.55; 
  const carH = carW * 1.5;
  playerY = H - carH - 80;
}

function spawnEnemy(now) {
  const carW = laneW * 0.55;
  const carH = carW * 1.5;
  const speed = baseSpeed * speedMul;
  
  // Logic: Ensure a minimum 1.2-second gap based on current speed
  const minGapPixels = speed * 1.2; 
  const verticalThreshold = carH + minGapPixels;

  const getTopY = (lane) => {
    let top = Infinity;
    enemies.forEach(e => { if(e.lane === lane && e.y < top) top = e.y; });
    return top;
  };

  const globalTop = () => {
    let top = Infinity;
    enemies.forEach(e => { if(e.y < top) top = e.y; });
    return top;
  };

  // Prevent "Wall of Cars" (all lanes filled at once)
  if (globalTop() < 150) return; 

  const possibleLanes = [0, 1, 2].filter(l => getTopY(l) > verticalThreshold);
  if (possibleLanes.length === 0) return;

  const lane = possibleLanes[Math.floor(Math.random() * possibleLanes.length)];
  enemies.push({
    lane,
    x: laneX[lane] + (laneW - carW) / 2,
    y: -carH - 50,
    w: carW, h: carH,
    color: Math.random() > 0.5 ? "#a78bfa" : "#22d3ee"
  });
  lastSpawnAt = now;
}

function drawCar(rect, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  ctx.fill();
  // Windshield
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(rect.x + rect.w*0.2, rect.y + rect.h*0.2, rect.w*0.6, rect.h*0.2);
}

function update(now) {
  if (!running) return;
  const dt = (now - lastFrameT) / 1000;
  lastFrameT = now;

  if (now > speedRampAt) {
    speedMul = Math.min(3.5, speedMul + 0.1);
    spawnEveryMs = Math.max(600, spawnEveryMs * 0.98);
    speedRampAt = now + 3000;
  }

  distance += baseSpeed * speedMul * dt * 0.1;
  distVal.textContent = Math.floor(distance);
  speedVal.textContent = speedMul.toFixed(1) + "×";

  if (now - lastSpawnAt > spawnEveryMs) spawnEnemy(now);

  ctx.clearRect(0, 0, W, H);
  // Road
  const roadW = laneW * 3 + 24;
  ctx.fillStyle = "#1e293b";
  ctx.fillRect((W - roadW)/2, 0, roadW, H);

  // Player
  const pW = laneW * 0.55;
  const pH = pW * 1.5;
  const player = { x: laneX[playerLane] + (laneW - pW)/2, y: playerY, w: pW, h: pH };
  drawCar(player, "#fbbf24");

  // Enemies
  enemies.forEach((e, i) => {
    e.y += baseSpeed * speedMul * dt;
    drawCar(e, e.color);
    
    // Collision
    if (e.lane === playerLane && e.y + e.h > player.y && e.y < player.y + player.h) {
      running = false;
      gameOverOverlay.classList.remove("hidden");
      finalDistEl.textContent = Math.floor(distance);
    }
  });
  enemies = enemies.filter(e => e.y < H);

  requestAnimationFrame(update);
}

function start() {
  running = true;
  distance = 0;
  speedMul = 1.0;
  enemies = [];
  playerLane = 1;
  lastSpawnAt = performance.now();
  speedRampAt = performance.now() + 3000;
  lastFrameT = performance.now();
  startOverlay.classList.add("hidden");
  gameOverOverlay.classList.add("hidden");
  requestAnimationFrame(update);
}

btnStart.onclick = start;
btnAgain.onclick = start;
window.onresize = resize;
resize();
</script>
</body>
</html>
