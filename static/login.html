<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


<script src="/static/favicon-set.js"></script>
<script src="/js/runtime-config.js?v=3"></script>
<script src="/js/spooky-api.js?v=3"></script>

<title>Login — Ayzen Studios</title>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #05050c;
      --panel: rgba(12, 14, 28, 0.72);
      --border: rgba(0, 245, 255, 0.22);
      --glow: #00f5ff;
      --accent: #bf5fff;
      --text: #e8ecf4;
      --muted: #6b7280;
      --danger: #f87171;
      --ok: #34d399;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 24px 0;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(0, 245, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 55% 35% at 100% 55%, rgba(191, 95, 255, 0.10), transparent 55%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 47px,
          rgba(0, 245, 255, 0.04) 47px,
          rgba(0, 245, 255, 0.04) 48px
        );
      pointer-events: none;
    }

    .wrap {
      width: min(520px, 94vw);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 80px rgba(0, 245, 255, 0.08);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .head {
      padding: 22px 22px 16px;
      border-bottom: 1px solid rgba(0, 245, 255, 0.12);
    }

    .brand {
      font-size: 12px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--glow);
    }

    .title {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--glow) 45%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      padding: 10px;
      gap: 10px;
      background: rgba(5, 5, 12, 0.55);
      border-top: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .tab {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(0, 245, 255, 0.14);
      background: rgba(18, 18, 30, 0.7);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      transition: filter 0.2s, border-color 0.2s;
    }

    .tab.active {
      border-color: rgba(0, 245, 255, 0.55);
      filter: brightness(1.1);
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.10);
    }

    .body {
      padding: 20px 22px 22px;
    }

    .row {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(10, 12, 24, 0.9);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: rgba(0, 245, 255, 0.55); }

    .pw-wrap {
      position: relative;
      width: 100%;
    }
    .pw-wrap input {
      padding-right: 46px;
    }
    .pw-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(10, 12, 24, 0.55);
      color: rgba(231, 234, 240, 0.9);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: filter 0.2s, border-color 0.2s, transform 0.12s;
      user-select: none;
    }
    .pw-toggle:hover { filter: brightness(1.08); border-color: rgba(0, 245, 255, 0.28); }
    .pw-toggle:active { transform: translateY(-50%) scale(0.98); }
    .pw-toggle .ico { font-size: 16px; line-height: 1; }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
      color: #05050c;
      background: linear-gradient(135deg, var(--glow), #5eead4);
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.28);
      transition: transform 0.12s, filter 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:hover { filter: brightness(1.06); }
    .btn:disabled { opacity: 0.55; cursor: default; }

    .link {
      flex: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.55);
      background: transparent;
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .msg {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      min-height: 20px;
    }

    .msg.error { color: var(--danger); }
    .msg.ok { color: var(--ok); }

    .otp-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(191, 95, 255, 0.25);
      background: rgba(191, 95, 255, 0.08);
      display: none;
    }

    .otp-box.visible { display: block; }

    .otp-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-ghost {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.55);
      background: transparent;
      color: #a5b4fc;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .foot {
      padding: 14px 22px 18px;
      border-top: 1px solid rgba(0, 245, 255, 0.10);
      background: rgba(5, 5, 12, 0.55);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* --- Loading overlay (login/signup/OTP) --- */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(5, 5, 12, 0.82);
      backdrop-filter: blur(10px);
    }
    .loading-overlay.visible { display: flex; }
    .loading-card {
      width: min(420px, 92vw);
      border-radius: 18px;
      border: 1px solid rgba(0, 245, 255, 0.22);
      background: linear-gradient(145deg, rgba(18, 18, 30, 0.85), rgba(10, 12, 24, 0.85));
      box-shadow: 0 24px 90px rgba(0,0,0,0.6), 0 0 60px rgba(0, 245, 255, 0.12);
      padding: 22px 20px;
      text-align: center;
    }
    .loading-title {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .spinner {
      width: 62px;
      height: 62px;
      border-radius: 999px;
      margin: 10px auto 14px;
      border: 3px solid rgba(0, 245, 255, 0.15);
      border-top-color: rgba(0, 245, 255, 0.95);
      box-shadow: 0 0 28px rgba(0, 245, 255, 0.25);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg {
      font-size: 14px;
      color: var(--text);
      letter-spacing: 0.02em;
      line-height: 1.45;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
  </style>
  <link rel="stylesheet" href="/css/site-footer.css?v=1">
<link rel="stylesheet" href="/css/ayzen-theme.css?v=1">
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-busy="true">
    <div class="loading-card" role="status">
      <div class="loading-title">Processing</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-msg" id="loadingMsg">Please wait…</div>
      <div class="loading-sub" id="loadingSub">This usually takes a moment.</div>
    </div>
  </div>

  <div class="wrap">
    <div class="head">
      <div class="brand">Ayzen Studios</div>
      <div class="title">Access Terminal</div>
      <div class="subtitle">Sign in to continue</div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">Login</button>
      <button class="tab" id="tabSignup" type="button">Sign up</button>
    </div>

    <div class="body">
      <form id="formLogin" autocomplete="on">
        <div class="row">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="row">
          <label for="loginPassword">Password</label>
          <div class="pw-wrap">
            <input id="loginPassword" name="password" type="password" placeholder="••••••••" required />
            <button class="pw-toggle" type="button" data-toggle-for="loginPassword" aria-label="Show password">
              <span class="ico" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="btnLogin" type="submit">Login</button>
        
        </div>
        <div class="msg" id="loginMsg"></div>
        <div class="otp-box" id="otpBoxLogin" aria-live="polite">
          <label for="otpLogin">OTP</label>
          <input id="otpLogin" type="text" inputmode="numeric" placeholder="6-digit OTP" />
          <div class="otp-actions">
            <button class="btn-ghost" type="button" id="btnSendOtpLogin">Send OTP</button>
            <button class="btn" type="button" id="btnVerifyOtpLogin">Verify</button>
          </div>
          <div class="msg" id="otpMsgLogin"></div>
        </div>
      </form>

      <form id="formSignup" autocomplete="on" style="display:none;">
        <div class="row">
          <label for="signupName">Name</label>
          <input id="signupName" name="name" type="text" placeholder="Enter your name" required autocomplete="name" />
        </div>
        <div class="row">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="row">
          <label for="signupPassword">Password</label>
          <div class="pw-wrap">
            <input
              id="signupPassword"
              name="password"
              type="password"
              placeholder="Min 6 chars (e.g. Aa1234)"
              minlength="6"
              title="At least 6 characters, with 1 uppercase letter, 1 lowercase letter, and 1 number. (Symbols optional.)"
              required
            />
            <button class="pw-toggle" type="button" data-toggle-for="signupPassword" aria-label="Show password">
              <span class="ico" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>
        <div class="row">
          <label for="signupPassword2">Confirm password</label>
          <div class="pw-wrap">
            <input
              id="signupPassword2"
              name="password2"
              type="password"
              placeholder="Re-enter password"
              minlength="6"
              required
            />
            <button class="pw-toggle" type="button" data-toggle-for="signupPassword2" aria-label="Show password">
              <span class="ico" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="btnSignup" type="submit">Create</button>
          
        </div>
        <div class="msg" id="signupMsg"></div>
        <div class="otp-box" id="otpBoxSignup" aria-live="polite">
          <label for="otpSignup">OTP</label>
          <input id="otpSignup" type="text" inputmode="numeric" placeholder="6-digit OTP" />
          <div class="otp-actions">
            <button class="btn-ghost" type="button" id="btnSendOtpSignup">Resend OTP</button>
            <button class="btn" type="button" id="btnVerifyOtpSignup">Verify</button>
          </div>
          <div class="msg" id="otpMsgSignup"></div>
        </div>
      </form>
    </div>

    <div class="foot">
      Tip: if you see 401 errors, log in again.
    </div>
  </div>

  <script>
    const TOKEN_KEY = "piyush_token";
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingMsg = document.getElementById("loadingMsg");
    const loadingSub = document.getElementById("loadingSub");

    let loadingCount = 0;
    function setLoading(on, { msg = "Please wait…", sub = "This usually takes a moment." } = {}) {
      if (on) {
        loadingCount++;
        loadingMsg.textContent = msg;
        loadingSub.textContent = sub;
        loadingOverlay.classList.add("visible");
      } else {
        loadingCount = Math.max(0, loadingCount - 1);
        if (loadingCount === 0) loadingOverlay.classList.remove("visible");
      }
    }

    function setMsg(el, text, kind) {
      el.textContent = text || "";
      el.classList.remove("error", "ok");
      if (kind) el.classList.add(kind);
    }

    function showTab(which) {
      const login = which === "login";
      document.getElementById("tabLogin").classList.toggle("active", login);
      document.getElementById("tabSignup").classList.toggle("active", !login);
      document.getElementById("formLogin").style.display = login ? "block" : "none";
      document.getElementById("formSignup").style.display = login ? "none" : "block";
      setMsg(document.getElementById("loginMsg"), "");
      setMsg(document.getElementById("signupMsg"), "");
    }

    document.getElementById("tabLogin").addEventListener("click", () => showTab("login"));
    document.getElementById("tabSignup").addEventListener("click", () => showTab("signup"));

    // Password visibility toggles (eye button)
    document.querySelectorAll("[data-toggle-for]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-toggle-for");
        const inp = id ? document.getElementById(id) : null;
        if (!inp) return;
        const nowText = inp.getAttribute("type") === "password";
        inp.setAttribute("type", nowText ? "text" : "password");
        const ico = btn.querySelector(".ico");
        if (ico) ico.textContent = nowText ? "🙈" : "👁";
        btn.setAttribute("aria-label", nowText ? "Hide password" : "Show password");
        inp.focus();
        try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch { /* ignore */ }
      });
    });

    async function api(path, body) {
      const res = await fetch(apiUrl(path), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data && data.detail ? data.detail : ("HTTP " + res.status);
        throw new Error(msg);
      }
      return data;
    }

    async function apiOtp(path, body) {
      const res = await fetch(apiUrl(path), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      // OTP APIs return {ok, detail} with 200; but we also support standard FastAPI errors.
      if (!res.ok) {
        const msg = data && data.detail ? data.detail : ("HTTP " + res.status);
        throw new Error(msg);
      }
      return data;
    }

    function saveToken(accessToken) {
      // Session-only login: clears when browser/app closes.
      sessionStorage.setItem(TOKEN_KEY, accessToken);
    }

    function redirectAfterLogin() {
      var params = new URLSearchParams(window.location.search);
      var next = params.get("next");
      if (next && next.startsWith("/") && !next.startsWith("//")) {
        window.location.href = next;
        return;
      }
      window.location.href = "/games";
    }

    function goGames() {
      redirectAfterLogin();
    }

    // If already logged in, jump straight to destination.
    (function boot() {
      const t = sessionStorage.getItem(TOKEN_KEY);
      if (t) goGames();
    })();

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("loginMsg");
      const btn = document.getElementById("btnLogin");
      setMsg(msg, "");
      btn.disabled = true;
      setLoading(true, { msg: "Logging in…", sub: "Verifying your credentials." });
      try {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        const data = await api("/api/auth/login", { email, password });
        saveToken(data.access_token);
        setMsg(msg, "Logged in. Redirecting…", "ok");
        setTimeout(goGames, 250);
      } catch (err) {
        const emsg = String(err && err.message ? err.message : err);
        setMsg(msg, emsg, "error");
        if (emsg.toLowerCase().includes("email not verified")) {
          document.getElementById("otpBoxLogin").classList.add("visible");
        }
      } finally {
        setLoading(false);
        btn.disabled = false;
      }
    });

    document.getElementById("formSignup").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("signupMsg");
      const btn = document.getElementById("btnSignup");
      setMsg(msg, "");
      btn.disabled = true;
      setLoading(true, { msg: "Creating account…", sub: "Preparing your profile and sending an OTP." });
      try {
        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        const password2 = document.getElementById("signupPassword2").value;
        if (password !== password2) {
          throw new Error("Passwords do not match.");
        }
        // Client-side validation (server also enforces).
        const ok =
          password.length >= 6 &&
          /[a-z]/.test(password) &&
          /[A-Z]/.test(password) &&
          /\d/.test(password);
        if (!ok) {
          throw new Error("Password must be 6+ characters with 1 uppercase, 1 lowercase, and 1 number.");
        }
        // Register now sends OTP and asks user to verify.
        const res = await fetch(apiUrl("/api/auth/register"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!(res.status === 201 || res.ok)) {
          const m = data && data.detail ? data.detail : ("HTTP " + res.status);
          throw new Error(m);
        }
        setMsg(msg, "Account created. OTP sent to your email — verify to login.", "ok");
        document.getElementById("otpBoxSignup").classList.add("visible");
      } catch (err) {
        setMsg(msg, String(err && err.message ? err.message : err), "error");
      } finally {
        setLoading(false);
        btn.disabled = false;
      }
    });

    async function sendOtp(emailElId, msgElId) {
      const email = document.getElementById(emailElId).value.trim();
      const msgEl = document.getElementById(msgElId);
      setMsg(msgEl, "");
      setLoading(true, { msg: "Sending OTP…", sub: "Check your inbox (and spam) in a moment." });
      const data = await apiOtp("/api/auth/request-email-otp", { email });
      setMsg(msgEl, data && data.detail ? data.detail : "OTP sent", "ok");
      setLoading(false);
    }

    async function verifyOtp(emailElId, otpElId, msgElId) {
      const email = document.getElementById(emailElId).value.trim();
      const code = document.getElementById(otpElId).value.trim();
      const msgEl = document.getElementById(msgElId);
      setMsg(msgEl, "");
      setLoading(true, { msg: "Verifying OTP…", sub: "One moment." });
      const data = await apiOtp("/api/auth/verify-email-otp", { email, code });
      if (data && data.ok) {
        setMsg(msgEl, "Verified. Now login.", "ok");
        showTab("login");
        document.getElementById("loginEmail").value = email;
        document.getElementById("loginPassword").focus();
      } else {
        setMsg(msgEl, data && data.detail ? data.detail : "Invalid OTP", "error");
      }
      setLoading(false);
    }

    document.getElementById("btnSendOtpLogin").addEventListener("click", async () => {
      try { await sendOtp("loginEmail", "otpMsgLogin"); }
      catch (e) {
        setLoading(false);
        setMsg(document.getElementById("otpMsgLogin"), String(e.message || e), "error");
      }
    });
    document.getElementById("btnVerifyOtpLogin").addEventListener("click", async () => {
      try { await verifyOtp("loginEmail", "otpLogin", "otpMsgLogin"); }
      catch (e) {
        setLoading(false);
        setMsg(document.getElementById("otpMsgLogin"), String(e.message || e), "error");
      }
    });

    document.getElementById("btnSendOtpSignup").addEventListener("click", async () => {
      try { await sendOtp("signupEmail", "otpMsgSignup"); }
      catch (e) {
        setLoading(false);
        setMsg(document.getElementById("otpMsgSignup"), String(e.message || e), "error");
      }
    });
    document.getElementById("btnVerifyOtpSignup").addEventListener("click", async () => {
      try { await verifyOtp("signupEmail", "otpSignup", "otpMsgSignup"); }
      catch (e) {
        setLoading(false);
        setMsg(document.getElementById("otpMsgSignup"), String(e.message || e), "error");
      }
    });
  </script>
  <div id="site-footer-root"></div>
  <script src="/js/site-footer.js?v=1" defer></script>
<script src="/js/ayzen-motion.js?v=1" defer></script>
</body>
</html>
