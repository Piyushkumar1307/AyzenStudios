    <circle r="52" fill="rgba(12,6,18,0.65)" stroke="rgba(167,139,250,0.35)" stroke-width="2"/>
    <path d="M-8-28 L-8 28 M8-18 L8 18 M-24-12 L-24 12 M24-22 L24 22 M-40 0 L-40 0 M40-8 L40 8" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#f472b6"/>
  </g>
  <text x="400" y="78" text-anchor="middle" fill="#f3eef8" font-family="system-ui,sans-serif" font-size="42" font-weight="800" letter-spacing="0.06em">Soundora</text>
  <text x="400" y="118" text-anchor="middle" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="0.22em">AI SONG GENERATOR</text>
  <g transform="translate(120 330)" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M0 20 Q40 0 80 20 T160 20 T240 20"/>
    <path d="M0 42 Q40 22 80 42 T160 42 T240 42" opacity="0.55"/>
