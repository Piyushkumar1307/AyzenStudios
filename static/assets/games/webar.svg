<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Web AR  scan and play">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041018"/>
      <stop offset="50%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="640" cy="80" r="70" fill="#38bdf8" opacity="0.22" filter="url(#blur)"/>
  <circle cx="150" cy="370" r="85" fill="#a78bfa" opacity="0.18" filter="url(#blur)"/>
  <text x="400" y="78" text-anchor="middle" fill="#f3f8ff" font-family="system-ui,sans-serif" font-size="42" font-weight="800" letter-spacing="0.08em">WEB AR</text>
  <text x="400" y="118" text-anchor="middle" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="0.22em">SCAN &amp; PLAY VIDEO</text>
  <g transform="translate(400 235)">
    <rect x="-92" y="-92" width="184" height="184" rx="18" fill="rgba(8,16,28,0.72)" stroke="url(#glow)" stroke-width="3"/>
    <path d="M-72-72 L-52-72 L-52-52 M52-72 L72-72 L72-52 M-72 72 L-52 72 L-52 52 M52 72 L72 72 L72 52" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <rect x="-34" y="-34" width="68" height="68" rx="8" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="10" fill="#a78bfa"/>
  </g>
  <text x="400" y="390" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="16" font-weight="600" letter-spacing="0.12em">POINT CAMERA AT TARGET</text>
</svg>
