<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Piyush-Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #05050c;
      --panel: rgba(12, 14, 28, 0.72);
      --border: rgba(0, 245, 255, 0.22);
      --glow: #00f5ff;
      --accent: #bf5fff;
      --text: #e8ecf4;
      --muted: #6b7280;
      --danger: #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(0, 245, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 55% 35% at 100% 55%, rgba(191, 95, 255, 0.10), transparent 55%),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 47px,
          rgba(191, 95, 255, 0.03) 47px,
          rgba(191, 95, 255, 0.03) 48px
        );
      pointer-events: none;
    }

    .card {
      width: min(560px, 94vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 80px rgba(0, 245, 255, 0.08);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .head {
      padding: 22px 22px 16px;
      border-bottom: 1px solid rgba(0, 245, 255, 0.12);
    }

    .brand {
      font-size: 12px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--glow);
    }

    .title {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--glow) 45%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .body { padding: 20px 22px 22px; }

    .row {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .val {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(10, 12, 24, 0.9);
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      min-width: 160px;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
      color: #05050c;
      background: linear-gradient(135deg, var(--glow), #5eead4);
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.20);
      transition: transform 0.12s, filter 0.2s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(0.98); }

    .btn-ghost {
      flex: 1;
      min-width: 160px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.55);
      background: transparent;
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .msg {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }
    .msg.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand">Piyush-Store</div>
      <div class="title">User Profile</div>
    </div>
    <div class="body">
      <div class="row">
        <div class="label">Name</div>
        <div class="val" id="nameVal">Loading…</div>
      </div>
      <div class="row">
        <div class="label">Email</div>
        <div class="val" id="emailVal">Loading…</div>
      </div>

      <div class="actions">
        <a class="btn-ghost" href="/">Back to store</a>
        <button class="btn" id="btnLogout" type="button">Logout</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "piyush_token";
    const token = sessionStorage.getItem(TOKEN_KEY);
    const msg = document.getElementById("msg");

    function fail(text) {
      msg.textContent = text;
      msg.classList.add("error");
    }

    function logout() {
      sessionStorage.removeItem(TOKEN_KEY);
      window.location.href = "/login";
    }

    document.getElementById("btnLogout").addEventListener("click", logout);

    (async function boot() {
      if (!token) {
        window.location.href = "/login";
        return;
      }
      try {
        const res = await fetch("/api/me", {
          headers: { Authorization: "Bearer " + token },
        });
        if (!res.ok) {
          logout();
          return;
        }
        const data = await res.json();
        document.getElementById("nameVal").textContent = data.name || "";
        document.getElementById("emailVal").textContent = data.email || "";
      } catch (e) {
        fail("Failed to load profile. Check your connection.");
      }
    })();
  </script>
</body>
</html>
