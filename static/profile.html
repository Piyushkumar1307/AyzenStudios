<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />


<script src="/static/favicon-set.js"></script>
<script src="/js/runtime-config.js?v=4"></script>
<script src="/js/spooky-api.js?v=4"></script>

<title>Profile — Ayzen Studios</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #05050c;
      --panel: rgba(12, 14, 28, 0.72);
      --border: rgba(0, 245, 255, 0.22);
      --glow: #00f5ff;
      --accent: #bf5fff;
      --text: #e8ecf4;
      --muted: #6b7280;
      --danger: #f87171;
      --ok: #34d399;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(0, 245, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 55% 35% at 100% 55%, rgba(191, 95, 255, 0.10), transparent 55%),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 47px,
          rgba(191, 95, 255, 0.03) 47px,
          rgba(191, 95, 255, 0.03) 48px
        );
      pointer-events: none;
    }

    .card {
      width: min(720px, 96vw);
      margin: 24px auto 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 80px rgba(0, 245, 255, 0.08);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .head {
      padding: 22px 22px 16px;
      border-bottom: 1px solid rgba(0, 245, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--glow);
    }

    .title {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--glow) 45%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .body { padding: 20px 22px 22px; }

    .identity {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 18px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.20);
      background: rgba(10, 12, 24, 0.55);
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 999px;
      border: 1px solid rgba(0, 245, 255, 0.30);
      background:
        radial-gradient(circle at 30% 30%, rgba(0, 245, 255, 0.22), transparent 55%),
        rgba(18, 18, 30, 0.65);
      box-shadow: 0 0 34px rgba(0, 245, 255, 0.18);
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .avatar .fallback {
      font-size: 42px;
      user-select: none;
      display: none;
    }

    .id-meta .name {
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }
    .id-meta .email {
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.06em;
      word-break: break-word;
    }
    .id-meta .badges {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.10);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #cbd5e1;
    }
    .badge.ok {
      background: rgba(52, 211, 153, 0.10);
      border-color: rgba(52, 211, 153, 0.25);
      color: #86efac;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    @media (min-width: 820px) {
      .grid { grid-template-columns: 1.2fr 0.8fr; }
    }

    .panel {
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(10, 12, 24, 0.45);
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, rgba(0,245,255,0.28), transparent);
      max-width: 180px;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 760px) {
      .avatar-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    }
    .avatar-choice {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(10, 12, 24, 0.75);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.12s, border-color 0.2s, filter 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-choice:hover { filter: brightness(1.06); border-color: rgba(0, 245, 255, 0.35); }
    .avatar-choice:active { transform: scale(0.98); }
    .avatar-choice img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-choice .emoji {
      font-size: 30px;
      line-height: 1;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
      user-select: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      min-width: 180px;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 850;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
      color: #05050c;
      background: linear-gradient(135deg, var(--glow), #5eead4);
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.20);
      transition: transform 0.12s, filter 0.2s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(0.98); }

    .btn-ghost {
      flex: 1;
      min-width: 180px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.55);
      background: transparent;
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-ghost.primary {
      border-color: rgba(34, 211, 238, 0.70);
      color: rgba(34, 211, 238, 0.95);
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.10) inset, 0 0 28px rgba(34, 211, 238, 0.10);
    }
    .btn-ghost.danger {
      border-color: rgba(248, 113, 113, 0.75);
      color: rgba(248, 113, 113, 0.95);
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.10) inset, 0 0 28px rgba(248, 113, 113, 0.08);
    }
    .btn-ghost.primary:hover { border-color: rgba(34, 211, 238, 0.95); filter: brightness(1.06); }
    .btn-ghost.danger:hover { border-color: rgba(248, 113, 113, 0.95); filter: brightness(1.06); }

    .msg {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }
    .msg.error { color: var(--danger); }
    .msg.ok { color: var(--ok); }

    /* --- Loading overlay (logout) --- */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(5, 5, 12, 0.82);
      backdrop-filter: blur(10px);
    }
    .loading-overlay.visible { display: flex; }
    .loading-card {
      width: min(460px, 92vw);
      border-radius: 18px;
      border: 1px solid rgba(0, 245, 255, 0.22);
      background: linear-gradient(145deg, rgba(18, 18, 30, 0.85), rgba(10, 12, 24, 0.85));
      box-shadow: 0 24px 90px rgba(0,0,0,0.6), 0 0 60px rgba(0, 245, 255, 0.12);
      padding: 22px 20px;
      text-align: center;
    }
    .loading-title {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .spinner {
      width: 62px;
      height: 62px;
      border-radius: 999px;
      margin: 10px auto 14px;
      border: 3px solid rgba(0, 245, 255, 0.15);
      border-top-color: rgba(0, 245, 255, 0.95);
      box-shadow: 0 0 28px rgba(0, 245, 255, 0.25);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg { font-size: 14px; color: var(--text); line-height: 1.45; }
    .loading-sub { margin-top: 6px; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
  </style>
  <link rel="stylesheet" href="/css/site-footer.css?v=1">
<link rel="stylesheet" href="/css/ayzen-theme.css?v=2">
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-busy="true">
    <div class="loading-card" role="status">
      <div class="loading-title">Processing</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-msg" id="loadingMsg">Please wait…</div>
      <div class="loading-sub" id="loadingSub">This usually takes a moment.</div>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <div>
        <div class="brand">Ayzen Studios</div>
        <div class="title">Account</div>
        <div class="subtitle">Profile & preferences</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
        <a class="btn-ghost primary" href="/leaderboard" style="min-width:auto; padding:10px 12px;">Leaderboard</a>
        <button class="btn-ghost danger" id="btnLogoutTop" type="button" style="min-width:auto; padding:10px 12px;">Logout</button>
        <a class="btn-ghost" href="/" style="min-width:auto; padding:10px 12px;">Back to store</a>
      </div>
    </div>

    <div class="body">
      <div class="identity">
        <div class="avatar" aria-label="Avatar">
          <img id="avatarImg" alt="Profile avatar" />
          <div class="fallback" id="avatarFallback">🧑</div>
        </div>
        <div class="id-meta">
          <div class="name" id="nameVal">Loading…</div>
          <div class="email" id="emailVal">Loading…</div>
          <div class="badges">
            <span class="badge ok">Verified</span>
            <span class="badge">Payments enabled</span>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="section-title">Profile image</div>
          <div class="avatar-grid" id="avatarGrid" aria-label="Choose an avatar"></div>
          <div class="msg" id="avatarMsg"></div>
          <div class="msg" id="msg"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "piyush_token";
    const token = sessionStorage.getItem(TOKEN_KEY);

    const msg = document.getElementById("msg");
    const avatarMsg = document.getElementById("avatarMsg");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingMsg = document.getElementById("loadingMsg");
    const loadingSub = document.getElementById("loadingSub");

    let loadingCount = 0;
    function setLoading(on, { msg = "Please wait…", sub = "This usually takes a moment." } = {}) {
      if (on) {
        loadingCount++;
        loadingMsg.textContent = msg;
        loadingSub.textContent = sub;
        loadingOverlay.classList.add("visible");
      } else {
        loadingCount = Math.max(0, loadingCount - 1);
        if (loadingCount === 0) loadingOverlay.classList.remove("visible");
      }
    }

    function setInlineMsg(el, text, kind) {
      el.textContent = text || "";
      el.classList.remove("error", "ok");
      if (kind) el.classList.add(kind);
    }

    function fail(text) { setInlineMsg(msg, text, "error"); }

    function logout() {
      setLoading(true, { msg: "Signing out…", sub: "See you soon." });
      sessionStorage.removeItem(TOKEN_KEY);
      setTimeout(() => { window.location.href = "/login"; }, 200);
    }
    document.getElementById("btnLogoutTop").addEventListener("click", logout);

    function hash32(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    function avatarStorageKey(userIdOrEmail) { return "piyush_avatar_v1_" + (userIdOrEmail || "anon"); }
    function safeJsonParse(s) { try { return JSON.parse(s); } catch { return null; } }
    function getStoredAvatar(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function setStoredAvatar(key, val) { try { localStorage.setItem(key, val); } catch { /* ignore */ } }

    function svgDataUri(svg) {
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }
    function makeAvatarSvg({ accent = "#00f5ff", accent2 = "#bf5fff", bg = "#0b1020", seed = "0" } = {}) {
      const h = hash32(seed);
      const eyes = (h % 3);
      const mouth = (Math.floor(h / 3) % 3);
      const deco = (Math.floor(h / 9) % 3);
      const eyeY = 52 + (h % 5);
      const eyeX = 46 + (h % 4);
      const r = 64;
      const svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="g" cx="30%" cy="25%" r="85%">
      <stop offset="0" stop-color="${accent}" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="${accent2}" stop-opacity="0.18"/>
      <stop offset="1" stop-color="${bg}" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="${accent}" stop-opacity="0.9"/>
      <stop offset="1" stop-color="${accent2}" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="${accent}" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="${bg}"/>
  <circle cx="128" cy="128" r="116" fill="url(#g)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.65"/>
  <g filter="url(#soft)">
    <circle cx="128" cy="132" r="${r}" fill="rgba(18,18,30,0.55)" stroke="rgba(148,163,184,0.22)" stroke-width="2"/>
    ${deco === 0 ? `<path d="M64 112 C92 86, 164 86, 192 112" fill="none" stroke="${accent}" stroke-width="6" stroke-linecap="round" opacity="0.7"/>` : ""}
    ${deco === 1 ? `<path d="M78 100 L178 100" stroke="${accent2}" stroke-width="6" stroke-linecap="round" opacity="0.55"/>` : ""}
    ${deco === 2 ? `<circle cx="128" cy="92" r="10" fill="${accent}" opacity="0.65"/>` : ""}
    <circle cx="${128 - eyeX}" cy="${eyeY}" r="${eyes === 0 ? 8 : eyes === 1 ? 6 : 7}" fill="rgba(231,234,240,0.92)"/>
    <circle cx="${128 + eyeX}" cy="${eyeY}" r="${eyes === 0 ? 8 : eyes === 1 ? 6 : 7}" fill="rgba(231,234,240,0.92)"/>
    <circle cx="${128 - eyeX + 2}" cy="${eyeY + 2}" r="3" fill="${accent}" opacity="0.85"/>
    <circle cx="${128 + eyeX + 2}" cy="${eyeY + 2}" r="3" fill="${accent}" opacity="0.85"/>
    ${
      mouth === 0
        ? `<path d="M104 150 C118 166, 138 166, 152 150" fill="none" stroke="rgba(231,234,240,0.82)" stroke-width="6" stroke-linecap="round"/>`
        : mouth === 1
        ? `<path d="M104 156 L152 156" stroke="rgba(231,234,240,0.82)" stroke-width="6" stroke-linecap="round"/>`
        : `<path d="M104 160 C118 148, 138 148, 152 160" fill="none" stroke="rgba(231,234,240,0.82)" stroke-width="6" stroke-linecap="round"/>`
    }
  </g>
</svg>`;
      return svgDataUri(svg.trim());
    }

    function normalizeAvatar(raw) {
      if (!raw) return null;
      const s = String(raw).trim();
      const obj = s.startsWith("{") ? safeJsonParse(s) : null;
      if (obj && obj.kind && obj.data) return obj;
      // Back-compat: old emoji string
      return { kind: "emoji", data: s };
    }

    function setAvatarOnPage(avatarObj) {
      const img = document.getElementById("avatarImg");
      const fallback = document.getElementById("avatarFallback");
      if (avatarObj && avatarObj.kind === "svg" && typeof avatarObj.data === "string") {
        img.src = avatarObj.data;
        img.style.display = "block";
        fallback.style.display = "none";
      } else {
        img.removeAttribute("src");
        img.style.display = "none";
        fallback.textContent = String((avatarObj && avatarObj.data) || "🧑");
        fallback.style.display = "block";
      }
    }

    function writeAvatar(key, avatarObj) {
      setStoredAvatar(key, JSON.stringify(avatarObj));
    }

    (async function boot() {
      if (!token) {
        window.location.href = "/login";
        return;
      }
      try {
        const res = await fetch(apiUrl("/api/me"), { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) { logout(); return; }
        const data = await res.json();

        const name = data && data.name ? String(data.name) : "";
        const email = data && data.email ? String(data.email) : "";
        document.getElementById("nameVal").textContent = name || "User";
        document.getElementById("emailVal").textContent = email || "";

        const userId = (data && data.id ? String(data.id) : "").trim();
        const seed = (userId || email || "anon").trim();
        const key = avatarStorageKey(seed);

        const presets = [
          { accent: "#00f5ff", accent2: "#bf5fff", bg: "#0b1020", seed: seed + ":a" },
          { accent: "#67e8f9", accent2: "#22d3ee", bg: "#071827", seed: seed + ":b" },
          { accent: "#a78bfa", accent2: "#7c3aed", bg: "#120a22", seed: seed + ":c" },
          { accent: "#34d399", accent2: "#22d3ee", bg: "#061b17", seed: seed + ":d" },
          { accent: "#fbbf24", accent2: "#f472b6", bg: "#1a0c12", seed: seed + ":e" },
          { accent: "#60a5fa", accent2: "#a78bfa", bg: "#0a1020", seed: seed + ":f" },
          { accent: "#fb7185", accent2: "#22d3ee", bg: "#1c0a12", seed: seed + ":g" },
          { accent: "#c4b5fd", accent2: "#00f5ff", bg: "#0b0b18", seed: seed + ":h" },
        ];
        const svgChoices = presets.map((p) => ({ kind: "svg", data: makeAvatarSvg(p) }));
        const emojiChoices = [
          "😄","😎","🤖","👽","🧑","🧑‍🚀","🧑‍💻","👑","🎭","🔥","✨","🌈",
          "🐶","🐱","🦊","🐻","🐼","🐨","🐯","🦁","🐸","🐵","🦄","🐧","🐙","🦖"
        ].map((e) => ({ kind: "emoji", data: e }));
        const avatarChoices = [...emojiChoices, ...svgChoices];

        const storedRaw = getStoredAvatar(key);
        const storedObj = normalizeAvatar(storedRaw);
        const chosen = storedObj || avatarChoices[hash32(seed) % avatarChoices.length];
        if (!storedObj) writeAvatar(key, chosen);
        setAvatarOnPage(chosen);

        const grid = document.getElementById("avatarGrid");
        grid.innerHTML = "";
        avatarChoices.forEach((av, idx) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "avatar-choice";
          b.setAttribute("aria-label", "Avatar " + (idx + 1));
          if (av.kind === "svg") {
            const im = document.createElement("img");
            im.alt = "Avatar option " + (idx + 1);
            im.src = av.data;
            b.appendChild(im);
          } else {
            const sp = document.createElement("span");
            sp.className = "emoji";
            sp.textContent = String(av.data || "🧑");
            b.appendChild(sp);
          }
          b.addEventListener("click", () => {
            writeAvatar(key, av);
            setAvatarOnPage(av);
            setInlineMsg(avatarMsg, "Profile image updated.", "ok");
          });
          grid.appendChild(b);
        });
      } catch (e) {
        fail("Failed to load profile. Check your connection.");
      }
    })();
  </script>
  <div id="site-footer-root"></div>
  <script src="/js/site-footer.js?v=8" defer></script>
<script src="/js/ayzen-motion.js?v=1" defer></script>
</body>
