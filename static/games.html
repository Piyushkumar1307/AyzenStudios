<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games — spookystudios</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root,[data-theme="dark"]{
    --bg:#0c0612;--card:#160d22;--text:#f3eef8;--muted:#9d8fb0;
    --accent:#a78bfa;--border:rgba(167,139,250,.22);--glow:rgba(167,139,250,.35);
    --stage-bg:#0a0610;
  }
  [data-theme="light"]{
    --bg:#f4f0f8;--card:#fff;--text:#1a1028;--muted:#5c4d6e;
    --accent:#6d28d9;--border:rgba(109,40,217,.18);--glow:rgba(109,40,217,.12);
    --stage-bg:#ebe6f2;
  }
  html,body{height:100%}
  body{
    font-family:"Outfit",system-ui,sans-serif;background:var(--bg);color:var(--text);
    line-height:1.6;display:flex;flex-direction:column;min-height:100vh;overflow:hidden;
  }
  .chat-fab-dock{
    position:fixed;right:20px;bottom:20px;z-index:50;
    display:flex;flex-direction:column;gap:12px;
  }
  .chat-orb{
    width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    text-decoration:none;border:2px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.3);
    transition:transform .2s,box-shadow .2s;
  }
  .chat-orb svg{width:26px;height:26px;color:#fff}
  .chat-orb:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 32px var(--glow)}
  .chat-orb.wa{background:linear-gradient(145deg,#25d366,#128c7e)}
  .chat-orb.tg{background:linear-gradient(145deg,#29a9eb,#0088cc)}

  .page-shell{
    flex:1;display:flex;flex-direction:column;max-width:1120px;width:100%;
    margin:0 auto;padding:20px 20px 16px;min-height:0;
  }
  .top{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:16px;flex-shrink:0;
  }
  .logo{font-family:"Creepster",cursive;font-size:26px;color:var(--accent);text-decoration:none}
  .actions{display:flex;gap:8px;align-items:center}
  .hdr{
    padding:8px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);text-decoration:none;font-size:13px;font-weight:600;
  }
  .theme-btn{
    width:40px;height:40px;border-radius:10px;border:1px solid var(--border);
    background:var(--card);cursor:pointer;font-size:18px;
    display:inline-flex;align-items:center;justify-content:center;
  }

  .page-head{flex-shrink:0;margin-bottom:14px}
  .page-head h1{font-family:"Creepster",cursive;font-size:32px;color:var(--accent);line-height:1.1}
  .page-head p{font-size:14px;color:var(--muted);margin-top:4px}

  .catalog-stage{
    flex:1;display:flex;flex-direction:column;min-height:0;
    border:1px solid var(--border);border-radius:16px;
    background:var(--stage-bg);
    box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
  }

  .stage-toolbar{
    flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);
    background:color-mix(in srgb,var(--card) 70%,transparent);
  }
  .filterbar{display:flex;gap:8px;flex-wrap:wrap}
  .filterbtn{
    padding:7px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;
  }
  .filterbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .stage-meta{font-size:12px;color:var(--muted);font-weight:600}

  .stage-box{flex:1;position:relative;min-height:0}
  .stage-scroll{
    height:100%;overflow-y:auto;overflow-x:hidden;
    scroll-behavior:smooth;
    overscroll-behavior:contain;
    padding:16px;
  }
  .stage-scroll::-webkit-scrollbar{width:8px}
  .stage-scroll::-webkit-scrollbar-thumb{
    background:color-mix(in srgb,var(--accent) 50%,transparent);border-radius:99px;
  }
  .stage-fade{
    position:absolute;left:0;right:0;height:40px;pointer-events:none;z-index:2;
  }
  .stage-fade--top{top:0;background:linear-gradient(180deg,var(--stage-bg),transparent)}
  .stage-fade--bottom{bottom:0;background:linear-gradient(0deg,var(--stage-bg),transparent)}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
  }

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s;
  }
  .card:hover{border-color:var(--accent);box-shadow:0 12px 36px var(--glow);transform:translateY(-2px)}

  .media{
    height:150px;position:relative;overflow:hidden;border-bottom:1px solid var(--border);
    background:#08040e;
  }
  .media img{
    width:100%;height:115%;object-fit:cover;object-position:center 20%;
    display:block;will-change:transform;transition:transform .15s ease-out;
  }
  .media::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 50%,rgba(12,6,18,.9) 100%);
  }
  .body{padding:14px 16px 16px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
  .body h3{font-size:16px;font-weight:700}
  .price{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--bg);color:var(--muted)}
  .desc{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cta{
    display:block;text-align:center;padding:10px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),#7c3aed);
    color:#fff;font-weight:700;font-size:13px;text-decoration:none;
  }

  .stage-footer{
    flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;border-top:1px solid var(--border);
    background:color-mix(in srgb,var(--card) 70%,transparent);
  }
  .pager{display:flex;align-items:center;gap:8px}
  .pager-btn{
    padding:8px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .pager-btn:disabled{opacity:.4;cursor:not-allowed}
  .pager-btn:not(:disabled):hover{border-color:var(--accent)}
  .page-info{font-size:13px;color:var(--muted);font-weight:600;min-width:10ch;text-align:center}
  .scroll-hint{font-size:11px;color:var(--muted)}

  .page-foot{
    flex-shrink:0;text-align:center;font-size:12px;color:var(--muted);padding-top:12px;
  }
  .page-foot a{color:var(--muted);margin:0 6px;text-decoration:none}
  .page-foot a:hover{color:var(--accent)}

  .empty-msg{
    grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted);font-size:15px;
  }

  @media (max-width:640px){
    .stage-toolbar{flex-direction:column;align-items:stretch}
    .stage-meta{text-align:center}
    .stage-footer{flex-wrap:wrap;justify-content:center}
    .scroll-hint{width:100%;text-align:center}
  }

  .roam-ghost{
    position:fixed;z-index:40;width:72px;height:86px;
    pointer-events:none;user-select:none;
    filter:drop-shadow(0 8px 20px rgba(167,139,250,.45));
    will-change:left,top,transform,opacity;
    transform-origin:center bottom;
  }
  .roam-ghost img{width:100%;height:100%;display:block}

  .roam-ghost.is-idle{
    animation:ghostBob 3.2s ease-in-out infinite;
  }
  @keyframes ghostBob{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-10px) rotate(2deg)}
  }

  .roam-ghost.is-roaming{
    animation:ghostWobble .55s ease-in-out infinite;
  }
  @keyframes ghostWobble{
    0%,100%{transform:rotate(-4deg) scaleX(1)}
    50%{transform:rotate(4deg) scaleX(-1)}
  }

  .roam-ghost.teleport-out{
    animation:ghostVanish .32s ease-in forwards;
  }
  @keyframes ghostVanish{
    0%{opacity:1;transform:scale(1) rotate(0)}
    100%{opacity:0;transform:scale(.15) rotate(18deg);filter:blur(6px)}
  }

  .roam-ghost.teleport-in{
    animation:ghostAppear .5s cubic-bezier(.2,1.2,.4,1) forwards;
  }
  @keyframes ghostAppear{
    0%{opacity:0;transform:scale(.2) rotate(-12deg);filter:blur(8px)}
    55%{opacity:1;transform:scale(1.12) rotate(4deg);filter:blur(0)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }

  .tp-burst{
    position:fixed;z-index:39;width:0;height:0;pointer-events:none;
    transform:translate(-50%,-50%);
  }
  .tp-ring{
    position:absolute;left:50%;top:50%;
    width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;
    border:2px solid var(--accent);
    box-shadow:0 0 24px var(--glow),inset 0 0 12px rgba(167,139,250,.35);
    animation:tpRing .7s ease-out forwards;
  }
  .tp-ring--delay{animation-delay:.08s;border-color:#c4b5fd}
  @keyframes tpRing{
    0%{opacity:1;transform:scale(.3)}
    100%{opacity:0;transform:scale(3.2)}
  }

  .tp-spark{
    position:absolute;left:50%;top:50%;
    width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;
    background:radial-gradient(circle,#fff 0%,var(--accent) 55%,transparent 70%);
    animation:tpSpark .55s ease-out forwards;
  }
  @keyframes tpSpark{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.2)}
  }

  .tp-flash{
    position:absolute;left:50%;top:50%;
    width:8px;height:8px;margin:-4px 0 0 -4px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 30px 12px var(--glow);
    animation:tpFlash .35s ease-out forwards;
  }
  @keyframes tpFlash{
    0%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(5)}
  }

  @media (prefers-reduced-motion:reduce){
    .roam-ghost.is-idle,.roam-ghost.is-roaming{animation:none}
    .roam-ghost.teleport-out,.roam-ghost.teleport-in{animation-duration:.01ms}
    .tp-ring,.tp-spark,.tp-flash{animation-duration:.01ms}
  }
</style>
<script>(function(){var s=localStorage.getItem("spooky-studios-theme");document.documentElement.setAttribute("data-theme",s==="light"||s==="dark"?s:"dark")})();</script>

<script>
var GAMES=[
  {id:"game-skeleton-catch",cat:"gesture-games",img:"/static/assets/games/fruit-ninja.png",title:"Fruit-Ninja",desc:"Slice fruit with hand gestures — pinch to play, swipe to slash.",href:"/game"},
  {id:"game-holo-fx",cat:"gesture-effect",img:"/static/assets/games/kamehameha.png",title:"Holo Hand FX",desc:"Neon hand trails and sci-fi FX controlled by your hands.",href:"/holo",hidden:true},
  {id:"game-kamehameha",cat:"gesture-effect",img:"/static/assets/games/kamehameha.png",title:"Kamehameha Beam",desc:"Charge energy between your palms and fire a two-hand blast.",href:"/kamehameha"},
  {id:"game-neon-pop",cat:"gesture-games",img:"/static/assets/games/neon-pop.png",title:"Neon Pop",desc:"Pinch glowing tiles before the timer runs out.",href:"/puzzle"},
  {id:"game-neon-runner",cat:"gesture-games",img:"/static/assets/games/neon-runner.png",title:"Neon Runner",desc:"Endless cyberpunk runner — pinch to jump.",href:"/runner"},
  {id:"game-tictactoe",cat:"gesture-games",img:"/static/assets/games/tictactoe.png",title:"Neon Tic-Tac-Toe",desc:"Pinch cells to play against a leveling AI.",href:"/tictactoe"},
  {id:"game-traffic",cat:"gesture-games",img:"/static/assets/games/traffic-rush.png",title:"Traffic Rush",desc:"Steer through neon traffic lanes with gestures.",href:"/traffic"},
  {id:"game-sky-sling-birds",cat:"gesture-games",img:"/static/assets/games/slingshot.png",title:"Sky Sling Birds",desc:"Pull back and launch with physics-based puzzles.",href:"/slingshot"},
  {id:"game-temple-lean-run",cat:"gesture-games",img:"/static/assets/games/neon-runner.png",title:"Temple Lean Run",desc:"Lean left or right to dodge in an endless runner.",href:"/temple-run",hidden:true}
];

var PER_PAGE=6;
var currentFilter="all";
var currentPage=1;

var grid=document.getElementById("gameGrid");
var viewport=document.getElementById("gameViewport");
var pageInfo=document.getElementById("pageInfo");
var gameCount=document.getElementById("gameCount");
var prevBtn=document.getElementById("prevPage");
var nextBtn=document.getElementById("nextPage");

function visibleGames(){
  return GAMES.filter(function(g){
    if(g.hidden) return false;
    return currentFilter==="all"||g.cat===currentFilter;
  });
}

function totalPages(){
  var n=visibleGames().length;
  return Math.max(1,Math.ceil(n/PER_PAGE));
}

function renderCard(g){
  var el=document.createElement("article");
  el.className="card";
  el.id=g.id;
  el.dataset.category=g.cat;
  var alt=g.title+" — spookystudios";
  el.innerHTML=
    '<div class="media"><img src="'+g.img+'" alt="'+alt.replace(/"/g,"&quot;")+'" loading="lazy"></div>'+
    '<div class="body"><div class="row"><h3>'+g.title+'</h3><span class="price">Free</span></div>'+
    '<p class="desc">'+g.desc+'</p>'+
    '<a class="cta" href="'+g.href+'">Play now</a></div>';
  return el;
}

function renderPage(){
  var all=visibleGames();
  var pages=totalPages();
  if(currentPage>pages) currentPage=pages;
  if(currentPage<1) currentPage=1;
  var start=(currentPage-1)*PER_PAGE;
  var slice=all.slice(start,start+PER_PAGE);

  grid.innerHTML="";
  if(!slice.length){
    grid.innerHTML='<p class="empty-msg">No games in this category.</p>';
  } else {
    slice.forEach(function(g){ grid.appendChild(renderCard(g)); });
  }

  if(gameCount) gameCount.textContent=all.length+(all.length===1?" game":" games");
  if(pageInfo) pageInfo.textContent="Page "+currentPage+" of "+pages;
  if(prevBtn) prevBtn.disabled=currentPage<=1;
  if(nextBtn) nextBtn.disabled=currentPage>=pages;
  if(viewport) viewport.scrollTop=0;
  requestAnimationFrame(applyParallax);
}

function applyParallax(){
  if(!viewport) return;
  var vr=viewport.getBoundingClientRect();
  var mid=vr.top+vr.height/2;
  viewport.querySelectorAll(".card").forEach(function(card){
    var img=card.querySelector(".media img");
    if(!img) return;
    var cr=card.getBoundingClientRect();
    var cardMid=cr.top+cr.height/2;
    var dist=(cardMid-mid)/vr.height;
    var shift=dist*-28;
    img.style.transform="translateY("+shift+"px) scale(1.06)";
  });
}

if(viewport){
  viewport.addEventListener("scroll",function(){
    if(viewport._parallaxTick) return;
    viewport._parallaxTick=true;
    requestAnimationFrame(function(){
      applyParallax();
      viewport._parallaxTick=false;
    });
  },{passive:true});
}

document.querySelectorAll("[data-filter]").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".filterbtn").forEach(function(b){
      b.classList.toggle("active",b===btn);
    });
    currentFilter=btn.dataset.filter||"all";
    currentPage=1;
    renderPage();
  });
});

if(prevBtn) prevBtn.addEventListener("click",function(){
  if(currentPage>1){ currentPage--; renderPage(); }
});
if(nextBtn) nextBtn.addEventListener("click",function(){
  if(currentPage<totalPages()){ currentPage++; renderPage(); }
});

(function(){
  var root=document.documentElement;
  var btn=document.getElementById("themeBtn");
  var KEY="spooky-studios-theme";
  function syncIcon(){ if(btn) btn.textContent=root.getAttribute("data-theme")==="dark"?"☀️":"🌙"; }
  btn&&btn.addEventListener("click",function(){
    var next=root.getAttribute("data-theme")==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);
    try{localStorage.setItem(KEY,next);}catch(_){}
    syncIcon();
  });
  syncIcon();
})();

renderPage();

(function roamGhost(){
  var ghost=document.getElementById("roamGhost");
  if(!ghost) return;
  var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W=72,H=86,PAD=18,FAB_CLEAR=130;
  var cornerIdx=0;
  var busy=false;
  var roamTimer=null;

  function corners(){
    var vw=window.innerWidth,vh=window.innerHeight;
    var brY=Math.max(PAD,vh-H-PAD-FAB_CLEAR);
    return [
      {id:"tl",x:PAD,y:PAD},
      {id:"tr",x:Math.max(PAD,vw-W-PAD),y:PAD},
      {id:"br",x:Math.max(PAD,vw-W-PAD),y:brY},
      {id:"bl",x:PAD,y:Math.max(PAD,vh-H-PAD)}
    ];
  }

  function place(c,animate){
    ghost.style.left=c.x+"px";
    ghost.style.top=c.y+"px";
    if(animate){
      ghost.style.transition="left "+animate.dur+"ms "+animate.ease+", top "+animate.dur+"ms "+animate.ease;
    } else {
      ghost.style.transition="none";
    }
  }

  function burstAt(x,y){
    var cx=x+W/2,cy=y+H/2;
    var el=document.createElement("div");
    el.className="tp-burst";
    el.style.left=cx+"px";
    el.style.top=cy+"px";
    el.innerHTML=
      '<span class="tp-flash"></span>'+
      '<span class="tp-ring"></span>'+
      '<span class="tp-ring tp-ring--delay"></span>';
    var angles=[0,60,120,180,240,300];
    angles.forEach(function(deg){
      var rad=deg*Math.PI/180;
      var dist=28+Math.random()*22;
      var sp=document.createElement("span");
      sp.className="tp-spark";
      sp.style.setProperty("--tx",Math.cos(rad)*dist+"px");
      sp.style.setProperty("--ty",Math.sin(rad)*dist+"px");
      el.appendChild(sp);
    });
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); },800);
  }

  function setMode(mode){
    ghost.classList.remove("is-idle","is-roaming");
    if(mode) ghost.classList.add(mode);
  }

  function nextCornerIndex(from,step){
    return (from+step+4)%4;
  }

  function teleportTo(idx){
    if(busy) return;
    busy=true;
    clearTimeout(roamTimer);
    var pts=corners();
    var from=pts[cornerIdx];
    var to=pts[idx];
    if(idx===cornerIdx){ busy=false; schedule(); return; }

    setMode(null);
    ghost.classList.add("teleport-out");
    burstAt(from.x,from.y);

    setTimeout(function(){
      ghost.classList.remove("teleport-out");
      place(to,false);
      cornerIdx=idx;
      ghost.classList.add("teleport-in");
      burstAt(to.x,to.y);
      setTimeout(function(){
        ghost.classList.remove("teleport-in");
        setMode("is-idle");
        busy=false;
        schedule();
      },reduced?50:520);
    },reduced?30:320);
  }

  function roamAlongEdge(steps){
    if(busy) return;
    busy=true;
    clearTimeout(roamTimer);
    var pts=corners();
    var targetIdx=nextCornerIndex(cornerIdx,steps);
    var to=pts[targetIdx];
    setMode("is-roaming");
    var dur=reduced?400:2200+Math.random()*1400;
    place(to,{dur:dur,ease:"cubic-bezier(.45,.05,.25,1)"});
    cornerIdx=targetIdx;
    roamTimer=setTimeout(function(){
      ghost.style.transition="none";
      setMode("is-idle");
      busy=false;
      schedule();
    },dur+80);
  }

  function schedule(){
    clearTimeout(roamTimer);
    var delay=reduced?4000:1800+Math.random()*2200;
    roamTimer=setTimeout(function(){
      if(busy) return;
      var roll=Math.random();
      if(roll<0.42){
        var options=[1,-1];
        roamAlongEdge(options[Math.floor(Math.random()*2)]);
      } else {
        var pts=corners();
        var choices=[];
        for(var i=0;i<pts.length;i++){
          if(i!==cornerIdx) choices.push(i);
        }
        var pick=choices[Math.floor(Math.random()*choices.length)];
        teleportTo(pick);
      }
    },delay);
  }

  function init(){
    var pts=corners();
    cornerIdx=Math.floor(Math.random()*pts.length);
    place(pts[cornerIdx],false);
    setMode("is-idle");
    schedule();
  }

  window.addEventListener("resize",function(){
    if(busy) return;
    var pts=corners();
    place(pts[cornerIdx],false);
  });

  init();
})();

(async function(){
  var t=sessionStorage.getItem("piyush_token");
  if(!t){location.href="/login";return;}
  var res=await fetch("/api/me",{headers:{Authorization:"Bearer "+t}});
  if(!res.ok){sessionStorage.removeItem("piyush_token");location.href="/login";}
})();
</script>
